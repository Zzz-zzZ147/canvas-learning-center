name: Bug report
description: Report a reproducible problem without including private student data.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Canvas Learning Center. Never include a Canvas token, password, student ID, signed URL, grade, teacher comment, submission, private note, or course file.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.2.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS 13 or later — Apple Silicon
        - macOS 13 or later — Intel
        - Windows 11 x64
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Canvas institution
      description: School name only. Do not include your account, email, or student ID.
      placeholder: "University or institution name"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and remove private course or account information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, signed URLs, personal data, grades, submissions, private notes, and course files.
          required: true
